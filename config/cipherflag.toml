# CipherFlag Configuration
#
# Keys are documented in docs/configuration.md. Older files may still carry
# [analysis] expiry_warning_days, [analysis.protocol_policy] and [storage]
# sqlite_path; CE does not use them.

[server]
listen = "0.0.0.0:8443"
frontend_url = "http://localhost:5174"
# Per-install files. Defaults suit the Docker image (root, /var/lib/cipherflag
# on the cipherflag-state volume); set writable paths when running from source.
# jwt_secret_path = "/var/lib/cipherflag/jwt-secret.key"
# setup_token_path = "/var/lib/cipherflag/setup-token"

[storage]
# PostgreSQL
postgres_url = "postgres://cipherflag:changeme@postgres:5432/cipherflag?sslmode=disable"

[analysis]
recheck_interval_hours = 6
scorer_enabled = true

[sources.zeek_file]
enabled = true
log_dir = "/var/log/zeek/current"
poll_interval_seconds = 30

# Not used by CE: there is no Corelight poller. The table is kept so older
# files and the sources API still round-trip it.
[sources.corelight]
enabled = false
api_url = ""
api_token = ""

[export.venafi]
enabled = false
platform = "cloud"              # "cloud" (Venafi TLS Protect Cloud) or "tpp" (on-prem TPP)

# Cloud settings (when platform = "cloud")
api_key = ""                    # Venafi Cloud API key (from Preferences > API Keys)
region = "us"                   # "us" (api.venafi.cloud) or "eu" (api.venafi.eu)

# TPP settings (when platform = "tpp")
base_url = ""                   # e.g., https://tpp.example.com
client_id = ""                  # OAuth2 client ID
refresh_token = ""              # OAuth2 refresh token
folder = "\\VED\\Policy\\Discovered\\CipherFlag"

# Push schedule
push_interval_minutes = 60
