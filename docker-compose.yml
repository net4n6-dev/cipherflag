#
# CipherFlag CE smoke-deploy compose.
#
# Brings up:
#   - postgres:16          (data store)
#   - cipherflag           (web UI and API on :8443)
#
# Optional Zeek network sensor (profile "zeek"):
#   NETWORK_INTERFACE=eth0 docker compose --profile zeek up -d
# captures live on that host interface (Linux hosts: on Docker Desktop the
# host network is the VM's). Without NETWORK_INTERFACE it only processes
# PCAPs dropped into ./pcap-input/<job>/. cipherflag reads its logs from
# the zeek-logs volume.
#
# EE-only services NOT included:
#   - The container-image scanner binary (Layer 6.2 EE)
#   - Velociraptor / Wazuh / Defender / SentinelOne / Tanium / Absolute /
#     Netwrix sidecars (Layer 3 EE adapters)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cipherflag
      POSTGRES_USER: cipherflag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherflag"]
      interval: 5s
      timeout: 5s
      retries: 5

  cipherflag:
    build:
      context: .
    image: ghcr.io/net4n6-dev/cipherflag-ce:2.3.0
    environment:
      CIPHERFLAG_CONFIG: /app/config/cipherflag.toml
    ports:
      - "8443:8443"
    volumes:
      - ./config:/app/config
      # Mount a working directory for the git repo scanner clone cache.
      - scanner-clones:/var/cache/cipherflag/scanner/clones
      # The zeek sensor's logs, at config/cipherflag.toml's
      # [sources.zeek_file] log_dir. Empty unless the zeek profile runs.
      - zeek-logs:/var/log/zeek/current:ro
    depends_on:
      postgres:
        condition: service_healthy

  zeek:
    profiles: [zeek]
    build:
      context: ./docker/zeek
    image: ghcr.io/net4n6-dev/cipherflag-ce-zeek:2.3.0
    environment:
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-}
    volumes:
      - zeek-logs:/zeek-logs
      - ${ZEEK_PCAP_DIR:-./pcap-input}:/pcap-input
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

volumes:
  pg-data:
  scanner-clones:
  zeek-logs:
