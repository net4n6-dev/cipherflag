name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole suite as a required job before publishing.
  workflow_call:

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test ./... -count=1 -v

      - name: Build binary
        run: CGO_ENABLED=0 go build -o cipherflag ./cmd/cipherflag/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cipherflag
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: cipherflag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherflag -d cipherflag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIPHERFLAG_TEST_DB: postgres://cipherflag:changeme@localhost:5432/cipherflag_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run integration tests
        run: go test -tags integration ./... -count=1

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx svelte-check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # The published sensor image once failed at startup (its base image moved
  # to a Zeek release without a policy it loaded) with nothing to catch it.
  # This builds it and runs it over a fixture PCAP; release.yml runs it too,
  # through this workflow, before publishing.
  zeek-sensor:
    name: Zeek Sensor Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sensor control script tests
        run: sh docker/zeek/test-entrypoint.sh

      - name: Build the sensor image and process a fixture PCAP
        run: docker/zeek/test-sensor.sh
