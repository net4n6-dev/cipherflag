name: Release

# CE images are published as cipherflag-ce and cipherflag-ce-zeek. The bare
# names ghcr.io/net4n6-dev/cipherflag and cipherflag-zeek belong to the
# separate Enterprise Edition and must not be used here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published unless the full CI suite passes on the tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches cmd/cipherflag Version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-tag.sh "$TAG"

  docker:
    name: Build and push Docker images
    needs: [ci, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A prerelease tag (v2.3.0-rc1) publishes only its own version tag;
      # :latest moves only on a plain vX.Y.Z release.
      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push CipherFlag image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/net4n6-dev/cipherflag-ce:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'ghcr.io/net4n6-dev/cipherflag-ce:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Zeek image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/zeek
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/net4n6-dev/cipherflag-ce-zeek:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'ghcr.io/net4n6-dev/cipherflag-ce-zeek:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      # Release page with generated notes only. CLI binaries are not published;
      # users build from source (see the README).
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
